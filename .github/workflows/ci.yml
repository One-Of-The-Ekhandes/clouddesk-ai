name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      llm_eval:
        description: "Also run the eval against the real LLM (needs the GROQ_API_KEY secret)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest
      - name: Eval (offline keyword baseline, regression gate)
        run: python -m evals.run_evals --min-category 0.65
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-baseline
          path: reports/eval_results.json

  llm-eval:
    if: github.event_name == 'workflow_dispatch' && inputs.llm_eval
    runs-on: ubuntu-latest
    needs: test
    env:
      LLM_PROVIDER: groq
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Eval (real LLM, gated at 85% category accuracy)
        run: python -m evals.run_evals --limit 20 --delay 3 --min-category 0.85
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: eval-llm
          path: reports/eval_results.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t clouddesk-ai:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name cd -p 8000:8000 -e LLM_PROVIDER=mock clouddesk-ai:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs -X POST localhost:8000/triage -H 'Content-Type: application/json' \
            -d '{"ticket":"The customer portal is returning 503 errors for everyone."}' | grep -q '"P1"'
